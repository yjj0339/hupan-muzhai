<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>湖畔木宅 · Lakeside Timber House</title>
<meta name="description" content="Three.js 复刻：临水而建的现代木格栅别墅，混凝土挑板、玻璃幕墙、屋顶花园与黄昏池塘倒影。">
<style>
  :root{
    --ink:#43331f; --ink-soft:#7a6647; --cream:#faf3e3; --cream2:#f3e7cd;
    --accent:#b3742e; --line:rgba(122,102,71,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",STSong,serif;
    background:#f6ecd8; color:var(--ink);
  }
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- 顶部标题 ---------- */
  .brand{
    position:fixed;top:18px;left:20px;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;gap:4px;
  }
  .brand .zh{
    font-size:clamp(22px,3.4vw,34px);letter-spacing:.32em;font-weight:700;
    color:var(--ink);text-shadow:0 1px 0 rgba(255,250,235,.8);
  }
  .brand .en{
    font-size:11px;letter-spacing:.42em;color:var(--ink-soft);
    text-transform:uppercase;text-shadow:0 1px 0 rgba(255,250,235,.7);
  }
  .brand .rule{width:64px;height:2px;background:var(--accent);margin-top:6px}

  /* ---------- 视角按钮 ---------- */
  .views{
    position:fixed;top:18px;right:16px;z-index:10;display:flex;flex-direction:column;gap:8px;align-items:flex-end;
  }
  .views button{
    font-family:inherit;font-size:13px;letter-spacing:.18em;cursor:pointer;
    padding:8px 16px;border:1px solid var(--line);border-radius:999px;
    background:rgba(250,243,227,.82);color:var(--ink);backdrop-filter:blur(6px);
    transition:all .25s ease;
  }
  .views button:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .views button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ---------- 底部提示 ---------- */
  .hint{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;
    font-size:12px;letter-spacing:.22em;color:var(--ink-soft);
    background:rgba(250,243,227,.78);border:1px solid var(--line);
    padding:7px 18px;border-radius:999px;backdrop-filter:blur(6px);
    white-space:nowrap;pointer-events:none;transition:opacity .8s ease;
  }

  /* ---------- 参观模式 ---------- */
  .tour-start{
    position:fixed;right:16px;bottom:16px;z-index:12;cursor:pointer;
    font-family:inherit;font-size:14px;letter-spacing:.3em;text-indent:.3em;
    padding:12px 26px;border:0;border-radius:999px;
    background:linear-gradient(135deg,#c08c46,#9a6a30);color:#fff8ec;
    box-shadow:0 6px 22px rgba(122,84,38,.35);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .tour-start:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(122,84,38,.4)}
  .tour-card{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;
    width:min(560px,calc(100vw - 28px));
    background:rgba(250,243,227,.92);border:1px solid var(--line);border-radius:18px;
    padding:14px 20px 12px;backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(90,64,28,.18);
    transition:opacity .5s ease, transform .5s ease;
  }
  .tour-card.hide{opacity:0;transform:translateX(-50%) translateY(16px);pointer-events:none}
  .tour-card .t-step{font-size:14px;font-weight:700;letter-spacing:.3em;color:var(--accent)}
  .tour-card .t-desc{margin-top:6px;font-size:13px;line-height:1.9;color:var(--ink)}
  .tour-card .t-ctrl{margin-top:10px;display:flex;gap:8px;justify-content:flex-end}
  .tour-card .t-ctrl button{
    font-family:inherit;font-size:12px;letter-spacing:.16em;cursor:pointer;
    padding:6px 14px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--ink-soft);transition:all .2s ease;
  }
  .tour-card .t-ctrl button:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  /* ---------- 载入幕布 ---------- */
  #veil{
    position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#faf3e3 0%,#f1e3c4 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity 1.1s ease;
  }
  #veil.hide{opacity:0;pointer-events:none}
  #veil .v-zh{font-size:34px;letter-spacing:.5em;text-indent:.5em;color:var(--ink)}
  #veil .v-en{font-size:11px;letter-spacing:.5em;color:var(--ink-soft)}
  #veil .v-bar{width:180px;height:2px;background:rgba(122,102,71,.25);overflow:hidden;border-radius:2px}
  #veil .v-bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  #veil .v-tip{font-size:12px;letter-spacing:.3em;color:var(--ink-soft)}
  #nogl{display:none;padding:0 30px;text-align:center;line-height:2;font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>

<div class="brand">
  <div class="zh">湖畔木宅</div>
  <div class="en">Lakeside Timber House</div>
  <div class="rule"></div>
</div>

<div class="views">
  <button data-v="0" class="on">参考机位</button>
  <button data-v="1">水岸低角</button>
  <button data-v="2">庭前侧赏</button>
  <button data-v="3">草坪远眺</button>
</div>

<div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 右上角切换视角</div>

<button class="tour-start" id="tourStart">▶ 开 始 参 观</button>
<div class="tour-card hide" id="tourCard">
  <div class="t-step" id="tourStep">湖畔木宅</div>
  <div class="t-desc" id="tourDesc">正在准备参观…</div>
  <div class="t-ctrl">
    <button id="tourPrev">上 一 个</button>
    <button id="tourPause">暂 停</button>
    <button id="tourNext">下 一 个</button>
    <button id="tourExit">退 出 参 观</button>
  </div>
</div>

<div id="veil">
  <div class="v-zh">湖畔木宅</div>
  <div class="v-en">LAKESIDE TIMBER HOUSE</div>
  <div class="v-bar"><i></i></div>
  <div class="v-tip">正在搭建场景…</div>
  <div id="nogl"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.min.js",
    "three/addons/controls/OrbitControls.js": "./lib/addons/controls/OrbitControls.js",
    "three/addons/objects/Water.js": "./lib/addons/objects/Water.js",
    "three/addons/objects/Sky.js": "./lib/addons/objects/Sky.js",
    "three/addons/utils/BufferGeometryUtils.js": "./lib/addons/utils/BufferGeometryUtils.js"
  }
}
</script>
<script>
  window.__errs = [];
  addEventListener('error', e => window.__errs.push(e.message + ' @ ' + (e.filename||'') + ':' + e.lineno));
  addEventListener('unhandledrejection', e => window.__errs.push('rej: ' + (e.reason && e.reason.message || e.reason)));
</script>
<script type="module" src="./js/main.js?v=3"></script>
</body>
</html>
